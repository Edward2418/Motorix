openapi: 3.0.3
info:
  title: API de Motorix - Sprint 4 (pagos, tickets y panel de control)
  version: 1.3.0
  description: >
    Amplía el contrato del Sprint 3 (ver ../../003-historial-inventario/contracts/api.yaml) con los pagos de las
    órdenes (incluido Mercado Pago en modo de pruebas), los tickets de servicio y el panel de control. Todas las
    rutas cuelgan de /api y requieren un token JWT (Bearer). Respuestas y errores usan los formatos de siempre
    ({ data }, { data, meta } y { error }). No existe ninguna operación DELETE sobre pagos ni tickets. Los permisos
    por rol se validan en el servidor. El mecánico no recibe campos de pago en ninguna respuesta.
    Cambios en rutas anteriores - el resumen de una orden (GET /orders) agrega paymentStatus y el detalle
    (GET /orders/{id}) agrega payment, ambos solo para ADMIN y RECEPTIONIST.
servers:
  - url: http://localhost:3000/api
security:
  - bearerAuth: []
tags:
  - name: Pagos
  - name: Mercado Pago
  - name: Tickets
  - name: Panel de control

paths:
  /payments/config:
    get:
      tags: [Pagos]
      summary: Métodos de pago disponibles (ADMIN, RECEPTIONIST)
      description: Informa si Mercado Pago está configurado en el servidor (hay credenciales), para habilitar o no la opción.
      responses:
        '200':
          description: Configuración de cobro
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      methods:
                        type: array
                        items: { $ref: '#/components/schemas/PaymentMethod' }
                      mercadoPagoEnabled: { type: boolean }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /orders/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pagos]
      summary: Pagos de una orden con su resumen (ADMIN, RECEPTIONIST)
      description: >
        Lista todos los pagos (también los rechazados y cancelados) del más reciente al más antiguo y el resumen
        calculado. No consulta a Mercado Pago; para actualizar un pago pendiente se usa /payments/{id}/refresh.
      responses:
        '200':
          description: Pagos y resumen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      payments:
                        type: array
                        items: { $ref: '#/components/schemas/Payment' }
                      summary: { $ref: '#/components/schemas/PaymentSummary' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Pagos]
      summary: Registra un pago de la orden (ADMIN, RECEPTIONIST)
      description: >
        Solo para órdenes TERMINADO o ENTREGADO con total mayor que cero. El importe no puede superar el importe
        disponible (total menos lo cobrado y lo reservado por pagos pendientes) - 409 AMOUNT_EXCEEDS_BALANCE con el
        disponible en el mensaje. EFECTIVO, TARJETA (cobrada en una terminal externa) y TRANSFERENCIA nacen PAGADO.
        MERCADO_PAGO crea una preferencia de pago en el servicio externo y nace PENDIENTE con su enlace de pago;
        si Mercado Pago no está configurado responde 409 MERCADOPAGO_NOT_CONFIGURED y si el servicio falla, 503
        SERVICE_UNAVAILABLE sin crear el pago. Nunca se reciben ni guardan datos de tarjeta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCreate' }
      responses:
        '201':
          description: Pago registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      payment: { $ref: '#/components/schemas/Payment' }
                      summary: { $ref: '#/components/schemas/PaymentSummary' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

  /payments/{id}/refresh:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Mercado Pago]
      summary: Actualiza el estado de un pago de Mercado Pago consultando al servicio externo (ADMIN, RECEPTIONIST)
      description: >
        Idempotente. Un pago PENDIENTE pasa a PAGADO si hay un cobro aprobado, a RECHAZADO si fue rechazado o su enlace
        venció, y sigue PENDIENTE si el servicio aún no lo resuelve (se informa en warning). Consultar de nuevo un pago
        ya resuelto no cambia nada. En un pago CANCELADO o RECHAZADO no se modifica el estado; si el servicio reporta un
        cobro aprobado se devuelve warning 'EXTERNAL_APPROVED' para conciliarlo manualmente. Solo para pagos
        MERCADO_PAGO (otro método responde 409).
      responses:
        '200':
          description: Pago actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      payment: { $ref: '#/components/schemas/Payment' }
                      summary: { $ref: '#/components/schemas/PaymentSummary' }
                      warning:
                        type: string
                        nullable: true
                        enum: [STILL_PENDING, EXTERNAL_APPROVED]
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

  /payments/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Pagos]
      summary: Cancela un pago con motivo
      description: >
        ADMIN y RECEPTIONIST cancelan un pago PENDIENTE (libera el importe reservado); solo ADMIN cancela un pago
        PAGADO (RECEPTIONIST recibe 403). El motivo es obligatorio. Un pago RECHAZADO o CANCELADO no cambia (409).
        El dinero de un pago cobrado se devuelve fuera del sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200':
          description: Pago cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      payment: { $ref: '#/components/schemas/Payment' }
                      summary: { $ref: '#/components/schemas/PaymentSummary' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /orders/{id}/ticket:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Tickets]
      summary: Genera el ticket de la orden, o devuelve el existente (ADMIN, RECEPTIONIST)
      description: >
        Solo para órdenes TERMINADO o ENTREGADO (409 en otro estado). Si la orden ya tiene ticket responde 200 con el
        mismo folio; si no, crea uno y responde 201. Dos solicitudes simultáneas producen un solo folio. No exige que
        la orden esté pagada.
      responses:
        '200':
          description: Ticket existente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Ticket' }
        '201':
          description: Ticket generado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
    get:
      tags: [Tickets]
      summary: Consulta el ticket de la orden (ADMIN, RECEPTIONIST)
      description: Se arma con los datos vigentes de la orden y sus pagos. 404 TICKET_NOT_FOUND si aún no se ha generado.
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /dashboard:
    get:
      tags: [Panel de control]
      summary: Indicadores y listas de atención del taller (solo ADMIN)
      description: >
        Calculado al consultar con la información real de órdenes, citas, mantenimientos, inventario y pagos; no hay
        copias de datos. El periodo aplica al importe cobrado y a las órdenes terminadas; el resto es el estado actual.
        Cada orden se cuenta una sola vez por indicador.
      parameters:
        - name: period
          in: query
          description: today, week (últimos 7 días, incluido hoy) o month (mes en curso, valor por defecto)
          schema: { type: string, enum: [today, week, month], default: month }
      responses:
        '200':
          description: Panel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    Validacion:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Falta la sesión o es inválida o venció
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinPermiso:
      description: El rol no permite la acción
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflicto:
      description: >
        Regla de negocio incumplida o estado incompatible. Códigos de este sprint - ORDER_NOT_PAYABLE,
        AMOUNT_EXCEEDS_BALANCE, PAYMENT_NOT_CANCELLABLE, PAYMENT_NOT_REFRESHABLE, MERCADOPAGO_NOT_CONFIGURED,
        ORDER_NOT_TICKETABLE, TICKET_NOT_FOUND (404) y CONFLICT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServicioNoDisponible:
      description: Mercado Pago no respondió o devolvió un error; no se creó ni cambió ningún pago
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string, description: Mensaje claro en español }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    Money:
      type: number
      format: double
      description: Importe con dos decimales

    PaymentMethod:
      type: string
      enum: [EFECTIVO, TARJETA, TRANSFERENCIA, MERCADO_PAGO]

    PaymentStatus:
      type: string
      enum: [PENDIENTE, PAGADO, RECHAZADO, CANCELADO]

    OrderPaymentStatus:
      type: string
      enum: [SIN_PAGO, PARCIAL, PAGADA]

    PaymentCreate:
      type: object
      required: [amount, method]
      properties:
        amount: { type: number, exclusiveMinimum: 0, maximum: 99999999.99, description: Con máximo dos decimales }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        reference:
          type: string
          maxLength: 100
          nullable: true
          description: Referencia opcional (autorización o rastreo). No se aceptan datos de tarjeta.

    Payment:
      type: object
      properties:
        id: { type: integer }
        orderId: { type: integer }
        orderFolio: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        reference: { type: string, nullable: true }
        paymentLink:
          type: string
          nullable: true
          description: Solo en pagos de Mercado Pago pendientes
        expiresAt: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        cancelReason: { type: string, nullable: true }
        createdByName: { type: string }
        cancelledByName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    PaymentSummary:
      type: object
      properties:
        total: { $ref: '#/components/schemas/Money' }
        collected: { $ref: '#/components/schemas/Money' }
        reserved: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }
        available: { $ref: '#/components/schemas/Money' }
        creditBalance: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/OrderPaymentStatus' }

    TicketLine:
      type: object
      properties:
        description: { type: string }
        quantity: { type: integer }
        unitPrice: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }

    Ticket:
      type: object
      properties:
        id: { type: integer }
        folio: { type: string, description: Formato TK-AAAA-NNNN }
        generatedAt: { type: string, format: date-time }
        generatedByName: { type: string }
        orderChangedSinceGenerated: { type: boolean }
        workshop:
          type: object
          properties:
            name: { type: string }
            address: { type: string }
            phone: { type: string }
        order:
          type: object
          properties:
            id: { type: integer }
            folio: { type: string }
            status: { type: string }
        client:
          type: object
          properties:
            name: { type: string }
            phone: { type: string }
        vehicle:
          type: object
          properties:
            description: { type: string, description: Marca, modelo y año }
            licensePlate: { type: string }
            mileage: { type: integer, description: Kilometraje del servicio (el de entrada si no existe) }
        services:
          type: array
          items: { $ref: '#/components/schemas/TicketLine' }
        labor:
          type: array
          items: { $ref: '#/components/schemas/TicketLine' }
        parts:
          type: array
          items: { $ref: '#/components/schemas/TicketLine' }
        subtotals:
          type: object
          properties:
            services: { $ref: '#/components/schemas/Money' }
            labor: { $ref: '#/components/schemas/Money' }
            parts: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        payments:
          type: array
          description: Pagos cobrados (PAGADO) y pendientes, con su método
          items: { $ref: '#/components/schemas/Payment' }
        paymentSummary: { $ref: '#/components/schemas/PaymentSummary' }

    DashboardOrderRef:
      type: object
      properties:
        id: { type: integer }
        folio: { type: string }
        clientName: { type: string }
        vehicleLabel: { type: string }
        status: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }
        finishedAt: { type: string, format: date-time, nullable: true }

    Dashboard:
      type: object
      properties:
        period:
          type: object
          properties:
            key: { type: string, enum: [today, week, month] }
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        indicators:
          type: object
          description: Los cuatro indicadores principales
          properties:
            vehiclesInRepair: { type: integer }
            openOrders: { type: integer }
            collected: { $ref: '#/components/schemas/Money' }
            lowStockParts: { type: integer }
        ordersByStatus:
          type: array
          description: Una entrada por cada estado de orden, también los que tienen cero
          items:
            type: object
            properties:
              status: { type: string }
              count: { type: integer }
        attention:
          type: object
          properties:
            finishedOrders:
              type: object
              properties:
                count: { type: integer }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/DashboardOrderRef' }
            upcomingAppointments:
              type: object
              properties:
                count: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: integer }
                      scheduledAt: { type: string, format: date-time }
                      clientName: { type: string }
                      vehicleLabel: { type: string }
                      status: { type: string }
            maintenance:
              type: object
              properties:
                overdue: { type: integer }
                soon: { type: integer }
                items:
                  type: array
                  description: Los más urgentes (vencidos primero)
                  items:
                    type: object
                    properties:
                      id: { type: integer }
                      description: { type: string }
                      vehicleLabel: { type: string }
                      clientName: { type: string }
                      visualStatus: { type: string, enum: [PROXIMO, VENCIDO] }
            lowStockParts:
              type: object
              properties:
                count: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: integer }
                      code: { type: string }
                      name: { type: string }
                      stock: { type: integer }
                      minStock: { type: integer }
                      stockLevel: { type: string, enum: [BAJO, AGOTADO] }
            pendingBalance:
              type: object
              properties:
                total: { $ref: '#/components/schemas/Money' }
                count: { type: integer }
                items:
                  type: array
                  description: Las 5 órdenes con mayor saldo por cobrar
                  items: { $ref: '#/components/schemas/DashboardOrderRef' }
